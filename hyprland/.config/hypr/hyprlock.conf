# Cores matugen
source = ~/.config/hypr/colors.conf

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    brightness = 0.6
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $primary
    font_size = 96
    font_family = VictorMono Nerd Font Italic
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d de %B")"
    color = $on_surface_variant
    font_size = 18
    font_family = VictorMono Nerd Font Italic
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = いつでも戻れる
    color = $outline
    font_size = 13
    font_family = VictorMono Nerd Font Italic
    position = 0, -30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = $outline_variant
    inner_color = $tertiary
    font_color = $on_secondary
    fade_on_empty = true
    placeholder_text = <i>senha...</i>
    fail_color = $error
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = $tertiary
    position = 0, -120
    halign = center
    valign = center
}
