source = ./colors.conf

$browser  = helium-browser
$editor   = $terminal nvim
$fileexp  = dolphin
$super    = SUPER
$terminal = kitty
$launcher = ~/dotfiles/scripts/rofi-open.sh

binds {
    pass_mouse_when_bound = false # Default
    scroll_event_delay = 300 # Default
    workspace_back_and_forth = true
    hide_special_on_workspace_change = true
    allow_workspace_cycles = false # Default
    workspace_center_on = 0 # Default
    focus_preferred_method = 0 # Default
    ignore_group_lock = false # Default
    movefocus_cycles_fullscreen = false # Default
    movefocus_cycles_groupfirst = false # Default
    window_direction_monitor_fallback = true # Default
    disable_keybind_grabbing = false # Default
    allow_pin_fullscreen = false # Default
    drag_threshold = 0 # Default
}

env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland,x11
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XCURSOR_THEME,phinger-cursors-light
env = XCURSOR_SIZE,24
env = GTK_IM_MODULE,simple

exec-once = pw-play ~/dotfiles/sounds/startup.mp3
exec-once = waybar &
exec-once = hypridle &
exec-once = awww-daemon
exec-once = mako
exec-once = ~/dotfiles/scripts/monitor-bat.sh
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = /usr/lib/xdg-desktop-portal-hyprland
exec-once = /usr/lib/xdg-desktop-portal

input {
    kb_model = # Default
    kb_layout = br
    kb_variant = # Default
    kb_options = # Default
    kb_rules = # Default
    kb_file = # Default
    numlock_by_default = true
    resolve_binds_by_sym = false # Default
    repeat_rate = 25 # Default
    repeat_delay = 600 # Default
    sensitivity = 0.0 # Default
    accel_profile = # Default
    force_no_accel = false # Default
    rotation = 0 # Default
    left_handed = false # Default
    scroll_points = # Default
    scroll_method = # Default
    scroll_button = 0 # Default
    scroll_button_lock = false # Default
    scroll_factor = 1.0 # Default
    natural_scroll = false
    follow_mouse = 1 # Default
    follow_mouse_threshold = 0.0 # Default
    focus_on_close = 0 # Default
    mouse_refocus = true # Default
    float_switch_override_focus = 1 # Default
    special_fallthrough = false # Default
    off_window_axis_events = 1 # Default
    emulate_discrete_scroll = 1 # Default

    touchpad {
        disable_while_typing = true # Default
        natural_scroll = false # Default
        scroll_factor = 1.0 # Default
        middle_button_emulation = false # Default
        tap_button_map = # Default
        clickfinger_behavior = false # Default
        tap-to-click = true # Default
        drag_lock = 1
        tap-and-drag = true # Default
        flip_x = false # Default
        flip_y = false # Default
        drag_3fg = 0 # Default
    }

    touchdevice {
        transform = -1 # Default
        output = [[Auto]] # Default
        enabled = true # Default
    }

    virtualkeyboard {
        share_states = 2 # Default
        release_pressed_on_close = false # Default
    }

    tablet {
        transform = -1 # Default
        output = # Default
        region_position = 0, 0 # Default
        absolute_region_position = false # Default
        region_size = 0, 0 # Default
        relative_input = false # Default
        left_handed = false # Default
        active_area_size = 0, 0 # Default
        active_area_position = 0, 0 # Default
    }
}

gestures {
    workspace_swipe_distance = 300 # Default
    workspace_swipe_touch = false # Default
    workspace_swipe_invert = true # Default
    workspace_swipe_touch_invert = false # Default
    workspace_swipe_min_speed_to_force = 30 # Default
    workspace_swipe_cancel_ratio = 0.5 # Default
    workspace_swipe_create_new = true # Default
    workspace_swipe_direction_lock = true # Default
    workspace_swipe_direction_lock_threshold = 10 # Default
    workspace_swipe_forever = false # Default
    workspace_swipe_use_r = false # Default
    close_max_timeout = 1000 # Default
}

group {
    auto_group = true # Default
    insert_after_current = true # Default
    focus_removed_window = true # Default
    drag_into_group = 1 # Default
    merge_groups_on_drag = true # Default
    merge_groups_on_groupbar = true # Default
    merge_floated_into_tiled_on_groupbar = false # Default
    group_on_movetoworkspace = false # Default
    col.border_active = 0x66ffff00 # Default, #66ffff
    col.border_inactive = 0x66777700 # Default, #667777
    col.border_locked_active = 0x66ff5500 # Default, #66ff55
    col.border_locked_inactive = 0x66775500 # Default, #667755

    groupbar {
        enabled = true # Default
        font_family = VictorMonoNerdFontPropo
        font_size = 15
        font_weight_active = normal # Default
        font_weight_inactive = normal # Default
        gradients = false # Default
        height = 10 # Default
        indicator_gap = 10
        indicator_height = 3 # Default
        stacked = false # Default
        priority = 3 # Default
        render_titles = true # Default
        text_offset = 0 # Default
        text_padding = 0 # Default
        scrolling = true # Default
        rounding = 3
        rounding_power = 0.5
        gradient_rounding = 3 # Default
        gradient_rounding_power = 0.5 # Default
        round_only_edges = false # Default
        gradient_round_only_edges = false # Default
        text_color = 0xffffffff # Default, #ffffff
        # text_color_inactive = # Default
        # text_color_locked_active = # Default
        # text_color_locked_inactive = # Default
        col.active = 0x66ffff00 # Default, #66ffff
        col.inactive = 0x66777700 # Default, #667777
        col.locked_active = 0x66ff5500 # Default, #66ff55
        col.locked_inactive = 0x66775500 # Default, #667755
        gaps_in = 2 # Default
        gaps_out = 2 # Default
        keep_upper_gap = false
        blur = true
    }
}

bind = $super, G, togglegroup
bind = $super, tab, changegroupactive
bind = $super SHIFT, H, moveintogroup, l
bind = $super SHIFT, L, moveintogroup, r
bind = $super SHIFT, K, moveintogroup, u
bind = $super SHIFT, J, moveintogroup, d

bindd = $super, dead_acute, Aumentar brilho, exec, brightnessctl set 10%-
bindd = $super, bracketleft, Diminuir brilho, exec, brightnessctl set +10%

bindd = $super, dead_tilde, Aumentar volume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindd = $super, ccedilla, Diminuir volume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindd = $super, bracketright, Mutar volume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

binddl = , switch:Lid Switch, Travar ao fechar a tampa, exec, hyprlock

bindd = $super SHIFT, F, Alternar tela cheia, fullscreen
bindd = $super, F, Alternar floating, togglefloating
bindd = $super, L, Focar na janela à direita, movefocus, l
bindd = $super, H, Focar na janela à esquerda, movefocus, r
bindd = $super, K, Focar na janela de baixo, movefocus, u
bindd = $super, J, Focar na janela de cima, movefocus, d
binddm = $super, mouse:272, Mover janela, movewindow
binddm = $super, mouse:273, Redimensionar janela, resizewindow

bindd = $super, period, Focar layout à direita, layoutmsg, move +col
bindd = $super, comma, Focar layout à esquerda ,layoutmsg, move -col
bindd = $super SHIFT, period, Mover janela para a direita, layoutmsg, swapcol r
bindd = $super SHIFT, comma, Mover janela para a esquerda, layoutmsg, swapcol l
bindd = $super CTRL, period, Aumentar tamanho com presets, layoutmsg, colresize +conf
bindd = $super CTRL, comma, Diminuir tamanho com presets, layoutmsg, colresize -conf
bindd = $super CTRL, F, Ajustar janela ativa, layoutmsg, fit active
bindd = $super CTRL SHIFT, F, Ajustar janelas visíveis, layoutmsg, fit visible
bindd = $super, P, Promover a sua própria coluna, layoutmsg, promote

bindd = $super, A, Abre o seletor de apps, exec, $launcher
bindd = $super, B, Abre o navegador, exec, $browser
bindd = $super, C, Abre o editor de código, exec, $editor
bindd = $super, E, Abre o explorador de arquivos, exec, $fileexp
bindd = $super ALT, P, Abre o hyprpicker, exec, hyprpicker -a -n
bind = SUPER, P, exec, grim -g "$(slurp)" - | swappy -f -
bind = SUPER SHIFT, P, exec, grim - | swappy -f -
bindd = $super ALT, L, Trava a tela, exec, hyprlock
bindd = $super, Q, Fecha a janela ativa, killactive
bindd = $super, RETURN, Abre o terminal, exec, pw-play ~/dotfiles/sounds/terminal-exec.mp3 & $terminal
bindd = $super, V, Abre a clipboard, exec, pw-play ~/dotfiles/sounds/rofi-cliphist.mp3 & cliphist list | rofi -dmenu -config ~/.config/rofi/cliphist.rasi | cliphist decode | wl-copy
bindd = $super CTRL, R, Recarrega waybar, exec, pkill cava; killall waybar; sleep 0.3; waybar &
bindd = $super, W, Abre seletor de wallpaper, exec, ~/dotfiles/wallpaper_selector/run.sh
bind = $super, R, exec, ~/dotfiles/scripts/screenrecord.sh full
bind = SUPER SHIFT, R, exec, ~/dotfiles/scripts/screenrecord.sh area

bind = $super SHIFT, 1, movetoworkspace, 1
bind = $super SHIFT, 2, movetoworkspace, 2
bind = $super SHIFT, 3, movetoworkspace, 3
bind = $super SHIFT, 4, movetoworkspace, 4
bind = $super SHIFT, 5, movetoworkspace, 5
bind = $super SHIFT, 6, movetoworkspace, 6
bind = $super SHIFT, 7, movetoworkspace, 7
bind = $super SHIFT, 8, movetoworkspace, 8
bind = $super SHIFT, 9, movetoworkspace, 9
bind = $super SHIFT, 0, movetoworkspace, 10

bind = $super, 1, workspace, 1
bind = $super, 2, workspace, 2
bind = $super, 3, workspace, 3
bind = $super, 4, workspace, 4
bind = $super, 5, workspace, 5
bind = $super, 6, workspace, 6
bind = $super, 7, workspace, 7
bind = $super, 8, workspace, 8
bind = $super, 9, workspace, 9
bind = $super, 0, workspace, 10

bind = $super, S, togglespecialworkspace, magic
bind = $super SHIFT, S, movetoworkspace, special:magic

layout {
    single_window_aspect_ratio = 0 0 # Default
    single_window_aspect_ratio_tolerance = 0.1 # Default
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_scale_notification = false # Default
    col.splash = 0xffffffff # Default
    splash_font_family = # Default
    force_default_wallpaper = -1 # Default
    vrr = 0 # Default
    mouse_move_enables_dpms = false # Default
    key_press_enables_dpms = false # Default
    name_vk_after_proc = true # Default
    always_follow_on_dnd = true # Default
    layers_hog_keyboard_focus = true # Default
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    disable_autoreload = false # Default
    enable_swallow = false # Default
    swallow_regex = # Default
    swallow_exception_regex = # Default
    focus_on_activate = false # Default
    mouse_move_focuses_monitor = true # Default
    allow_session_lock_restore = false # Default
    session_lock_xray = false # Default
    background_color = 0xffffffff
    close_special_on_empty = true # Default
    on_focus_under_fullscreen = 2 # Default
    exit_window_retains_fullscreen = false # Default
    initial_workspace_tracking = 1
    middle_click_paste = false
    render_unfocused_fps = 15 # Default
    disable_xdg_env_checks = false # Default
    lockdead_screen_delay = 1000 # Default
    enable_anr_dialog = true # Default
    anr_missed_pings = 5 # Default
    size_limits_tiled = false # Default
    disable_watchdog_warning = false # Default
}

monitor = eDP-1, 1920x1080@60, 0x0, 1

xwayland {
    enabled = true # Default
    use_nearest_neighbor = true # Default
    force_zero_scaling = false # Default
    create_abstract_socket = false # Default
}

opengl {
    nvidia_anti_flicker = true # Default
}

render {
    direct_scanout = 0 # Default
    expand_undersized_textures = true # Default
    xp_mode = false # Default
    ctm_animation = 2 # Default
    cm_enabled = true # Default
    send_content_type = true # Default
    cm_auto_hdr = 1 # Default
    new_render_scheduling = false # Default
    non_shader_cm = 3 # Default
    cm_sdr_eotf = default # Default
    commit_timing_enabled = true # Default
}

ecosystem {
    no_update_news = false # Default
    no_donation_nag = true
    enforce_permissions = false # Default
}

quirks {
    prefer_hdr = 0 # Default
}

general {
  border_size = 2
  gaps_in = 3
  gaps_out = 10
  float_gaps = 10
  gaps_workspaces = 0 # Default
    col.active_border = $primary $inverse_primary 45deg
    col.inactive_border = $background
  layout = scrolling
  no_focus_fallback = true
  resize_on_border = true
  extend_border_grab_area = 5
  hover_icon_on_border = true
  allow_tearing = false # Default
  resize_corner = 0 # Default
  modal_parent_blocking = true # Default
  locale = pt_br

  snap {
    enabled = true
    window_gap = 3
    monitor_gap = 10
    border_overlap = false
    respect_gaps = true
  }
}

decoration {
    rounding = 8
    rounding_power = 4.0
    active_opacity = 1.0 # Default
    inactive_opacity = 1.0 # Default
    fullscreen_opacity = 1.0 # Default
    dim_modal = true # Default
    dim_inactive = true
    dim_strength = 0.5 # Default
    dim_special = 0.2 # Default
    dim_around = 0.4 # Default
    screen_shader = # Default
    border_part_of_window = true # Default

    blur {
        enabled = true
        size = 1
        passes = 3
        ignore_opacity = true # Default
        new_optimizations = true # Default
        xray = false # Default
        noise = 0.1
        contrast = 1
        brightness = 0.8
        vibrancy = 0.5
        vibrancy_darkness = 0.0
        special = false # Default
        popups = false # Default
        popups_ignorealpha = 0.2 # Default
        input_methods = false # Default
        input_methods_ignorealpha = 0.2 # Default
    }

    shadow {
        enabled = true # Default
        range = 3
        render_power = 1
        sharp = false
        # color = Pelo papael de parede
        # color_inactive = Pelo papel de parede
        offset = 0, 0
        scale = 1.0
    }
}

animations {
    enabled = true
    workspace_wraparound = false

    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = snappy, 0.68, -0.55, 0.27, 1.55
    bezier = liner, 1, 1, 1, 1

    animation = windows, 1, 4, overshot, slide
    animation = windowsOut, 1, 3, smoothOut, slide
    animation = windowsMove, 1, 3, snappy, slide

    animation = workspaces, 1, 4, smoothIn, slidevert
    animation = specialWorkspace, 1, 3, overshot, slidevert

    animation = fade, 1, 3, smoothIn
    animation = fadeDim, 1, 3, smoothOut
    animation = border, 1, 8, default
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
}
