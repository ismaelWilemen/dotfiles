include colors.conf
background_opacity 0.8

font_family      family=MonoLisa features='+ss14 +ss08 +ss07 +calt +ss11 +liga +ss02'
font_size        16
bold_font        auto
italic_font      auto
bold_italic_font auto

cursor_shape     block
cursor_beam_thickness 10
cursor_shape_unfocused hollow
cursor_trail           1

scrollback_lines        10000
scrollback_pager_hisotry_size 10

mouse_hide_wait -3.0

tab_bar_style powerline
tab_powerline_style round
tab_bar_edge bottom

notify_on_cmd_finish invisible 20
